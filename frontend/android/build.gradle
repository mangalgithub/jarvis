// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Fix: kotlin-stdlib 1.8+ merged jdk7/jdk8 into the main artifact.
    // Old transitive deps still pull in the separate jdk7/jdk8 jars (1.6.x),
    // causing duplicate class errors. Force everything to 1.8.22.
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

// ── Java compatibility override ───────────────────────────────────────────────
// Our installed JDK is 19. capacitor-android defaults to VERSION_21, which
// causes "invalid source release: 21". Force all submodules to use Java 19.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_19
                    targetCompatibility JavaVersion.VERSION_19
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
